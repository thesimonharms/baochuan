[package]
name = "baochuan"
version = "0.3.0"
edition = "2024"
rust-version = "1.85"
description = "A multi-provider AI API client for Rust — connecting your code to every major AI provider."
license = "MIT"
readme = "README.md"
repository = "https://github.com/simonharms/baochuan"
documentation = "https://docs.rs/baochuan"
keywords = ["ai", "llm", "openai", "anthropic", "gemini"]
categories = ["api-bindings", "asynchronous", "web-programming::http-client"]

[dependencies]
tokio = { version = "1.53", features = ["full"] }
# reqwest 0.13 defaults to rustls. `query` is a separate feature as of 0.13
# (Cloudflare model listing uses RequestBuilder::query).
reqwest = { version = "0.13", features = ["json", "stream", "query"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
futures-util = "0.3.31"
thiserror = "2.0.17"
tracing = "0.1.41"
async-trait = "0.1.88"
bytes = "1.10"

[dev-dependencies]
tokio = { version = "1.53", features = ["full", "test-util"] }
tracing-subscriber = "0.3.20"
mockito = "1.7.2"
